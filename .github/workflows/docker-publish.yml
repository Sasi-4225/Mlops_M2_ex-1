name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-prediction

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          echo "IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build Docker image
        run: docker build -t student-result-prediction:ci .
      - name: Start test container
        run: docker run -d --name student-result-ci -p 5000:5000 student-result-prediction:ci
      - name: Test health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo 'Health check passed.'
              exit 0
            fi
            echo 'Waiting for API...'
            sleep 3
          done
          echo 'Health check failed.'
          docker logs student-result-ci
          exit 1
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error -X POST http://localhost:5000/predict -H 'Content-Type: application/json' --data '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}')
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction":"PASS"'
      - name: Show container logs
        if: always()
        run: docker logs student-result-ci || true
      - name: Remove test container
        if: always()
        run: docker rm -f student-result-ci || true
      - name: Log in to GHCR
        if: github.event_name == 'push' && success()
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag tested image
        if: github.event_name == 'push' && success()
        run: |
          docker tag student-result-prediction:ci "$IMAGE_ID:latest"
          docker tag student-result-prediction:ci "$IMAGE_ID:sha-${{ github.sha }}"
      - name: Push tested image to GHCR
        if: github.event_name == 'push' && success()
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${{ github.sha }}"
