services:
  api:
    build:
      context: .
    container_name: student-result-api
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: student-result-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: student-result-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
